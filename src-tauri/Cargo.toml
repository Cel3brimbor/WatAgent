[package]
name = "waterflow"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "waterflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-oauth = { path = "./plugins/oauth" }
tauri-plugin-secure-store = { path = "./plugins/secure-store" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
