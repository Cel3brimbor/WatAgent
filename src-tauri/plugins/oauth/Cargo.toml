[package]
name = "tauri-plugin-oauth"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
publish = false
links = "tauri-plugin-oauth"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2.11.3" }

[target.'cfg(target_os = "ios")'.dependencies]
serde = { version = "1", features = ["derive"] }
